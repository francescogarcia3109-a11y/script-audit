# This repository's own tests: the corpus, the blind-adversary holdout, and the
# CLI's exit codes.
name: Tests

on:
  # branches-ignore matters: the Publish CI status workflow pushes to
  # ci-status, and without this that push would run these tests on a branch
  # that contains only status.txt - they would fail, publish a red status,
  # and trigger themselves again. Forever.
  push:
    branches-ignore: [ci-status]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Corpus - coverage 61/61, false alarms 0/61
        run: lua5.4 tests/run_corpus.lua
      - name: Blind adversary holdout - coverage 23/23, false alarms 0/16
        run: lua5.4 tests/run_holdout3.lua
      - name: CLI - exit codes
        run: bash cli/tests/run_cli_tests.sh
